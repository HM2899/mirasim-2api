<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>登录 Mirasim Relay</title>
    <link rel="stylesheet" href="/assets/dashboard.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="brand login-brand"><span class="brand-mark">M</span><span>Mirasim Relay</span></div>
        <div class="login-heading">
          <p class="eyebrow">CONTROL CONSOLE</p>
          <h1 id="login-title">登录控制台</h1>
        </div>
        <form id="login-form" class="login-form">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button id="login-submit" class="button button-primary" type="submit">登录</button>
        </form>
      </section>
    </main>
    <script type="module" src="/assets/login.js"></script>
  </body>
</html>
